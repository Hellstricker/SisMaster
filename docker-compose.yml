services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sismaster-sqlserver
    environment:
      SA_PASSWORD: "SisMaster@2026!"
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'SisMaster@2026!' -Q 'SELECT 1' -C -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  campeonato-api:
    build:
      context: ./backend/src
      dockerfile: services/SisMaster.WebApps.WebApi/Dockerfile
    container_name: sismaster-campeonato-api
    ports:
      - "5200:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ConnectionStrings__CampeonatoConnection: "Server=sqlserver,1433;Database=SisMaster;User Id=sa;Password=SisMaster@2026!;MultipleActiveResultSets=true;TrustServerCertificate=True"
    depends_on:
      sqlserver:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: sismaster-frontend
    ports:
      - "3000:80"
    depends_on:
      - campeonato-api

volumes:
  sqlserver_data:
