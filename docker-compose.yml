# Segredos e portas vêm do arquivo .env (copie de .env.example). Nada de senha neste arquivo.
# O nome do projeto (COMPOSE_PROJECT_NAME) isola ambientes: o padrão "sismaster" é o de uso diário;
# o teste ponta a ponta usa outro projeto, com volume e portas próprios (scripts/e2e.ps1).
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ${COMPOSE_PROJECT_NAME:-sismaster}-sqlserver
    environment:
      MSSQL_SA_PASSWORD: "${SA_PASSWORD:?Defina SA_PASSWORD no arquivo .env}"
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
    ports:
      - "${DB_PORT:-1433}:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -C -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  campeonato-api:
    build:
      context: ./backend/src
      dockerfile: services/SisMaster.WebApps.WebApi/Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-sismaster}-campeonato-api
    ports:
      - "${API_PORT:-5200}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT:-Production}"
      ConnectionStrings__CampeonatoConnection: "Server=sqlserver,1433;Database=${DB_NAME:-SisMaster};User Id=sa;Password=${SA_PASSWORD:?Defina SA_PASSWORD no arquivo .env};MultipleActiveResultSets=true;TrustServerCertificate=True"
    depends_on:
      sqlserver:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: ${COMPOSE_PROJECT_NAME:-sismaster}-frontend
    ports:
      - "${FRONT_PORT:-3000}:80"
    depends_on:
      - campeonato-api

volumes:
  sqlserver_data:
