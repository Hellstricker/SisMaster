# Segredos e portas vêm do arquivo .env (copie de .env.example). Nada de senha neste arquivo.
# O nome do projeto (COMPOSE_PROJECT_NAME) isola ambientes: o padrão "sismaster" é o de uso diário;
# o teste ponta a ponta usa outro projeto, com volume e portas próprios (scripts/e2e.ps1).
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ${COMPOSE_PROJECT_NAME:-sismaster}-sqlserver
    environment:
      MSSQL_SA_PASSWORD: "${SA_PASSWORD:?Defina SA_PASSWORD no arquivo .env}"
      ACCEPT_EULA: "Y"
      MSSQL_PID: "${MSSQL_PID:-Express}"   # Express é a edição gratuita para produção (banco de até 10 GB); a Developer não é licenciada para produção
    ports:
      - "${DB_PORT:-1433}:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -C -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  identidade-api:
    build:
      context: ./backend/src
      dockerfile: services/SisMaster.Identidade.Api/Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-sismaster}-identidade-api
    # Sem porta publicada: só o nginx (e a rede do Docker) alcança. O front acessa por /api/identidade.
    environment:
      ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT:-Production}"
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=${IDENTIDADE_DB_NAME:-SisMasterIdentidade};User Id=sa;Password=${SA_PASSWORD:?Defina SA_PASSWORD no arquivo .env};MultipleActiveResultSets=true;TrustServerCertificate=True"
      JwtSettings__Segredo: "${JWT_SEGREDO:?Defina JWT_SEGREDO no arquivo .env (mínimo 32 caracteres)}"
      # Administrador inicial: criado só se ainda não existir nenhum usuário. Troca de senha obrigatória no primeiro acesso.
      # Tentativas de login por minuto e por endereço (o padrão vale para uso real; o ambiente de teste sobe com mais).
      Seguranca__LimiteDeLoginsPorMinuto: "${LIMITE_LOGINS_POR_MINUTO:-20}"
      Seguranca__LimiteDeCadastrosPorHora: "${LIMITE_CADASTROS_POR_HORA:-5}"
      Bootstrap__AdminEmail: "${ADMIN_EMAIL:-}"
      Bootstrap__AdminNome: "${ADMIN_NOME:-Administrador}"
      Bootstrap__AdminSenha: "${ADMIN_SENHA_INICIAL:-}"
      # E-mail das senhas temporárias. Sem SMTP_HOST, nada é enviado (só vai para o log) e as contas novas ficam sem como entrar.
      Email__Provedor: "${EMAIL_PROVEDOR:-Log}"
      Email__Host: "${SMTP_HOST:-}"
      Email__Porta: "${SMTP_PORT:-587}"
      Email__Usuario: "${SMTP_USER:-}"
      Email__Senha: "${SMTP_PASSWORD:-}"
      Email__Remetente: "${SMTP_FROM:-}"
      Email__NomeExibicao: "${EMAIL_NOME:-SisMaster}"
      # Endereço público do sistema, usado no link do e-mail de recuperação de senha.
      App__UrlPublica: "${APP_URL:-http://localhost:3000}"
    depends_on:
      sqlserver:
        condition: service_healthy

  campeonato-api:
    build:
      context: ./backend/src
      dockerfile: services/SisMaster.WebApps.WebApi/Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-sismaster}-campeonato-api
    ports:
      - "${API_PORT:-5200}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT:-Production}"
      JwtSettings__Segredo: "${JWT_SEGREDO:?Defina JWT_SEGREDO no arquivo .env (mínimo 32 caracteres)}"
      # E-mail do sistema (inscrição recebida e mudanças de situação): mesma configuração da Identidade.
      Email__Provedor: "${EMAIL_PROVEDOR:-Log}"
      Email__Host: "${SMTP_HOST:-}"
      Email__Porta: "${SMTP_PORT:-587}"
      Email__Usuario: "${SMTP_USER:-}"
      Email__Senha: "${SMTP_PASSWORD:-}"
      Email__Remetente: "${SMTP_FROM:-}"
      Email__NomeExibicao: "${EMAIL_NOME:-SisMaster}"
      Seguranca__LimiteDeVinculosPorHora: "${LIMITE_VINCULOS_POR_HORA:-8}"
      ConnectionStrings__CampeonatoConnection: "Server=sqlserver,1433;Database=${DB_NAME:-SisMaster};User Id=sa;Password=${SA_PASSWORD:?Defina SA_PASSWORD no arquivo .env};MultipleActiveResultSets=true;TrustServerCertificate=True"
    depends_on:
      sqlserver:
        condition: service_healthy

  # Site público (Next.js): lê só a API pública (/api/publico) pela rede interna. Uma associação fixa, pela sigla.
  site:
    build:
      context: ./frontend/site
    container_name: ${COMPOSE_PROJECT_NAME:-sismaster}-site
    environment:
      API_INTERNO: "http://campeonato-api:8080"
      SITE_ASSOCIACAO_SIGLA: "${SITE_ASSOCIACAO_SIGLA:-ABABAS}"
    depends_on:
      - campeonato-api

  frontend:
    build:
      context: ./frontend
    container_name: ${COMPOSE_PROJECT_NAME:-sismaster}-frontend
    ports:
      - "${FRONT_PORT:-3000}:80"
    depends_on:
      - campeonato-api
      - identidade-api
      - site

volumes:
  sqlserver_data:
