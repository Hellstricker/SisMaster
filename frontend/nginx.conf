server {
    listen 80;
    server_name localhost;
    # Redirecionamentos relativos: o nginx não sabe a porta publicada (3000 no Docker).
    absolute_redirect off;
    root /usr/share/nginx/html;
    index index.html;

    # Cabeçalhos de segurança (valem para todas as respostas; nenhuma location redefine add_header).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    server_tokens off;

    # Resolução do DNS do Docker a cada uso: o nginx sobe mesmo que a API ainda não esteja de pé.
    resolver 127.0.0.11 valid=10s;
    set $api http://campeonato-api:8080;
    set $identidade http://identidade-api:8080;
    set $site http://site:3000;

    # Login e usuários (Identidade). Vem antes de /api/ para ter prioridade.
    location /api/identidade/ {
        proxy_pass $identidade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API REST (o app de gestão chama /api/... na mesma origem)
    location /api/ {
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SignalR (súmula em tempo real): WebSocket
    location /hubs/ {
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # App de gestão (SPA): arquivos reais ou o index.html do app.
    # O app navega para "/admin" (sem barra) ao entrar; sem este redirecionamento, recarregar essa página cairia no site público.
    location = /admin { return 301 /admin/; }
    location /admin/ {
        try_files $uri $uri/ /admin/index.html;
    }

    # Área do árbitro: telas estáticas da mesa (/arbitros/*.html) e o app React (jogos do dia, súmula) para o resto.
    # Sem "$uri/" de propósito: não há index.html na pasta e isso daria 403 em /arbitros/.
    location = /arbitros { return 301 /arbitros/; }
    location /arbitros/ {
        try_files $uri /admin/index.html;
    }

    # Endereços antigos da mesa (antes ficavam na raiz) continuam funcionando.
    location ~ ^/(mesario-tempo|mesario-stats|placar)\.html$ {
        return 301 /arbitros/$1.html$is_args$args;
    }

    # Site público (Next.js): tudo que não é gestão, árbitros, API ou tempo real. O Next também serve /_next/ (scripts e estilos).
    location / {
        proxy_pass $site;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
