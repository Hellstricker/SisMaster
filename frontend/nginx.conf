server {
    listen 80;
    server_name localhost;
    # Redirecionamentos relativos: o nginx não sabe a porta publicada (3000 no Docker).
    absolute_redirect off;
    root /usr/share/nginx/html;
    index index.html;

    # Resolução do DNS do Docker a cada uso: o nginx sobe mesmo que a API ainda não esteja de pé.
    resolver 127.0.0.11 valid=10s;
    set $api http://campeonato-api:8080;

    # API REST (o app de gestão chama /api/... na mesma origem)
    location /api/ {
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SignalR (súmula em tempo real): WebSocket
    location /hubs/ {
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # App de gestão (SPA): arquivos reais ou o index.html do app
    location /admin/ {
        try_files $uri $uri/ /admin/index.html;
    }

    # Área do árbitro: telas estáticas da mesa (/arbitros/*.html) e o app React (jogos do dia, súmula) para o resto.
    # Sem "$uri/" de propósito: não há index.html na pasta e isso daria 403 em /arbitros/.
    location = /arbitros { return 301 /arbitros/; }
    location /arbitros/ {
        try_files $uri /admin/index.html;
    }

    # Endereços antigos da mesa (antes ficavam na raiz) continuam funcionando.
    location ~ ^/(mesario-tempo|mesario-stats|placar)\.html$ {
        return 301 /arbitros/$1.html$is_args$args;
    }

    # Página inicial estática (links para /admin e /arbitros; futuramente o site público)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
