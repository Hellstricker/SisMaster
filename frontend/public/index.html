<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SisMaster</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    :root { color-scheme: light dark; --bg:#f1f5f9; --card:#fff; --text:#0f172a; --text2:#64748b; --border:#e2e8f0; --accent:#4f46e5; }
    @media (prefers-color-scheme: dark) { :root { --bg:#0f172a; --card:#1e293b; --text:#f1f5f9; --text2:#94a3b8; --border:#334155; --accent:#818cf8; } }
    body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px;
      padding: 24px 16px; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, "Segoe UI", sans-serif; }
    header { text-align: center; }
    h1 { margin: 0; font-size: 2rem; letter-spacing: -0.5px; color: var(--accent); }
    header p { margin: 6px 0 0; color: var(--text2); }
    nav { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; width: 100%; max-width: 560px; }
    nav a { display: block; text-align: center; text-decoration: none; color: var(--text); background: var(--card);
      border: 1px solid var(--border); border-radius: 14px; padding: 26px 18px; font-weight: 700; font-size: 1.1rem; transition: border-color .15s, transform .15s; }
    nav a:hover { border-color: var(--accent); transform: translateY(-2px); }
    nav small { display: block; margin-top: 6px; font-weight: 400; font-size: .85rem; color: var(--text2); }
    footer { color: var(--text2); font-size: .8rem; }
  </style>
</head>
<body>
  <header>
    <h1>SisMaster</h1>
    <p>Basquete Master — conteúdo público em breve.</p>
  </header>
  <nav>
    <a href="/admin/">Gestão<small>Associações, temporadas, inscrições e jogos</small></a>
    <a href="/arbitros/">Árbitros<small>Jogos do dia, súmula e mesa</small></a>
  </nav>
  <footer>SisMaster</footer>
</body>
</html>
