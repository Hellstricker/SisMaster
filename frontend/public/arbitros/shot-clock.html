<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SisMaster — Shot Clock</title>
  <script src="signalr.min.js"></script>
  <script src="conexao.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #050810;
      color: #e6edf3;
      height: 100%;
      overflow: hidden;
    }
    body {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      height: 100vh; gap: 4vw; position: relative;
    }

    /* Tudo em vw: legível de longe e escala do celular ao monitor grande. */
    .faixa-offline { display: none; position: fixed; top: 0; left: 0; right: 0; z-index: 20; background: #b91c1c; color: #fff; text-align: center; font-weight: 800; font-size: 3vw; padding: 1vw; letter-spacing: .1vw; }
    body.offline .faixa-offline { display: block; }
    body.offline .main { opacity: .5; }

    .period-badge { font-size: 3.6vw; font-weight: 900; color: #f97316; background: rgba(249,115,22,.12); border: .2vw solid rgba(249,115,22,.5); border-radius: 5vw; padding: .5vw 3vw; white-space: nowrap; }

    .main { display: flex; flex-direction: column; align-items: center; gap: 3vw; transition: opacity .3s; }

    .shot-clock {
      font-size: 46vw; font-weight: 900; font-variant-numeric: tabular-nums; letter-spacing: -2vw;
      line-height: 1; color: #f59e0b;
      width: 56vw; height: 56vw; border-radius: 50%;
      border: 1vw solid rgba(245,158,11,.5); background: rgba(245,158,11,.08);
      display: flex; align-items: center; justify-content: center;
      transition: color .3s, border-color .3s, background .3s;
    }
    .shot-clock.casa { border-color: rgba(34,197,94,.6); }
    .shot-clock.visit { border-color: rgba(59,130,246,.6); }
    .shot-clock.off { font-size: 20vw; color: #4a5a72; border-color: #2a3346; background: transparent; }
    .shot-clock.warning {
      color: #ef4444; border-color: rgba(239,68,68,.7); background: rgba(239,68,68,.12);
      animation: blink .5s ease-in-out infinite alternate;
    }
    @keyframes blink { from{opacity:1} to{opacity:.35} }

    a.back { position: fixed; bottom: 1vw; right: 1vw; font-size: 1.2vw; color: #1e2430; text-decoration: none; z-index: 10; }
    a.back:hover { color: #5a6478; }
  </style>
</head>
<body>

<div class="faixa-offline" role="alert">SEM CONEXÃO — o shot clock pode estar desatualizado</div>

<div class="main">
  <div class="period-badge" id="periodoLabel">—</div>
  <div class="shot-clock" id="shotClock">24</div>
</div>

<a class="back" href="/arbitros/">← Início</a>

<script>
  // Tela só do shot clock, para o monitor perto de cada cesta — pensada para abrir ao lado do Placar (mesmo link da súmula).
  const params = new URLSearchParams(location.search);
  const PARTIDA_ID = params.get('partidaId') || '';

  if (!PARTIDA_ID) {
    document.body.innerHTML = '<div style="padding:40px;color:#ef4444;font-size:1.5rem;text-align:center">Partida ID não informado.<br><a style="color:#f97316" href="/arbitros/">Voltar</a></div>';
  }

  let clockState = null;
  let tickInterval = null;
  let deslocamentoMs = 0; // hora do servidor menos a do aparelho: a tela com a hora errada não adianta nem atrasa o relógio

  const conexao = SisMasterConexao.criar({
    partidaId: PARTIDA_ID,
    aoMudar: setStatus,
    registrar: connection => {
      connection.on('EstadoAtual', state => { updateClock(state.cronometro); if (state.periodoAtual) setPeriodo(state.periodoAtual); });
      connection.on('CronometroAtualizado', cron => { updateClock(cron); if (cron.periodoAtual) setPeriodo(cron.periodoAtual); });
      connection.on('SumulaEncerrada', () => { document.getElementById('shotClock').className = 'shot-clock off'; document.getElementById('shotClock').textContent = '—'; });
    }
  });

  function setStatus(ok) {
    document.body.classList.toggle('offline', !ok);
  }

  function setPeriodo(n) {
    document.getElementById('periodoLabel').textContent = periodLabel(n);
  }

  function updateClock(cron) {
    clockState = cron;
    if (cron.agoraMs) deslocamentoMs = cron.agoraMs - Date.now();

    if (cron.ativo) {
      if (!tickInterval) tickInterval = setInterval(tick, 100);
    } else {
      if (tickInterval) { clearInterval(tickInterval); tickInterval = null; }
      renderShotClock(cron.shotClockSegundos);
    }
  }

  function tick() {
    if (!clockState) return;
    const now = Date.now() + deslocamentoMs;
    let shotSec = clockState.shotClockSegundos;
    if (clockState.shotClockAtivo && clockState.shotClockIniciadoEmMs) {
      shotSec = Math.max(0, clockState.shotClockSegundosAoIniciar - (now - clockState.shotClockIniciadoEmMs) / 1000);
    }
    renderShotClock(shotSec);
  }

  // Arredonda para cima, com 1 casa decimal (nunca mostra "0.0" antes da hora de verdade acabar).
  const arredondarDecimo = sec => Math.ceil(sec * 10) / 10;

  function renderShotClock(sec) {
    const el = document.getElementById('shotClock');
    // Cronômetro de jogo rodando mas o shot clock não ligou: o período acaba antes dele estourar, não vale mais.
    if (clockState?.ativo && !clockState?.shotClockAtivo) {
      el.textContent = '—';
      el.className = 'shot-clock off';
      return;
    }
    const s = Math.ceil(sec);
    // Últimos 5s: com décimos.
    el.textContent = sec <= 4.9 ? arredondarDecimo(sec).toFixed(1) : s.toString().padStart(2, '0');
    const posse = clockState?.posseCasa ? 'casa' : 'visit';
    el.className = 'shot-clock ' + (clockState?.ativo ? posse : '') + (clockState?.ativo && s <= 5 ? ' warning' : '');
  }

  function periodLabel(n) {
    return ['', '1º PERÍODO', '2º PERÍODO', '3º PERÍODO', '4º PERÍODO', 'PRORROGAÇÃO'][n] || n + 'º PERÍODO';
  }
</script>
</body>
</html>
