<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SisMaster — Placar</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.7/signalr.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #050810;
      color: #e6edf3;
      height: 100%;
      overflow: hidden;
    }
    body {
      display: grid;
      grid-template-rows: auto 1fr auto;
      height: 100vh;
    }

    /* ── Top bar ── */
    .topbar {
      background: #0a0d14;
      border-bottom: 1px solid #1a2030;
      padding: 6px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .topbar-logo { font-size: 0.8rem; color: #f97316; font-weight: 700; letter-spacing: 1px; }
    .topbar-right { display: flex; align-items: center; gap: 20px; font-size: 0.72rem; color: #8b949e; }
    .status-live { display: flex; align-items: center; gap: 5px; }
    .status-dot { width: 6px; height: 6px; border-radius: 50%; background: #ef4444; }
    .status-dot.ok { background: #22c55e; animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.5} }

    /* ── Main grid ── */
    .main {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: stretch;
      overflow: hidden;
    }

    /* ── Team panels ── */
    .team {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 12px 16px;
      gap: 4px;
      position: relative;
    }

    .team-name {
      font-size: clamp(1rem, 2.8vw, 2rem);
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 3px;
      opacity: .9;
    }
    .team-score {
      font-size: clamp(5rem, 20vw, 15rem);
      font-weight: 900;
      line-height: .9;
      font-variant-numeric: tabular-nums;
      letter-spacing: -4px;
    }
    .team-fouls {
      display: flex;
      align-items: center;
      gap: 5px;
      margin-top: 4px;
    }
    .foul-dot {
      width: clamp(8px, 1.4vw, 14px);
      height: clamp(8px, 1.4vw, 14px);
      border-radius: 50%;
      transition: background .3s;
    }
    .foul-dot.filled { background: #f59e0b; }
    .foul-dot.empty { border: 1.5px solid #2a3040; }
    .foul-count {
      font-size: clamp(.65rem, 1.2vw, .9rem);
      font-weight: 600;
      color: #f59e0b;
      margin-left: 2px;
    }

    .casa .team-name  { color: #22c55e; }
    .casa .team-score { color: #22c55e; }
    .visit .team-name  { color: #3b82f6; }
    .visit .team-score { color: #3b82f6; }

    /* ── Center clock panel ── */
    .center-panel {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 12px 20px;
      gap: 8px;
      border-left: 1px solid #1a2030;
      border-right: 1px solid #1a2030;
      min-width: clamp(140px, 22vw, 280px);
    }

    .period-badge {
      font-size: clamp(.75rem, 1.8vw, 1.1rem);
      font-weight: 700;
      color: #f97316;
      background: rgba(249,115,22,.1);
      border: 1px solid rgba(249,115,22,.35);
      border-radius: 20px;
      padding: 3px 14px;
      letter-spacing: .5px;
    }

    /* THE CLOCK — dominant element */
    .game-clock {
      font-size: clamp(3.5rem, 11vw, 9rem);
      font-weight: 900;
      font-variant-numeric: tabular-nums;
      letter-spacing: -2px;
      line-height: 1;
      color: #e6edf3;
      transition: color .3s;
    }
    .game-clock.running { color: #22c55e; }
    .game-clock.warning { color: #ef4444; }

    /* Shot clock — circular badge below main clock */
    .shot-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }
    .shot-label { font-size: .6rem; text-transform: uppercase; letter-spacing: .1em; color: #5a6478; }
    .shot-clock {
      font-size: clamp(1.8rem, 4vw, 3.2rem);
      font-weight: 900;
      font-variant-numeric: tabular-nums;
      color: #f59e0b;
      background: rgba(245,158,11,.08);
      border: 1.5px solid rgba(245,158,11,.3);
      border-radius: 50%;
      width: clamp(56px, 8vw, 90px);
      height: clamp(56px, 8vw, 90px);
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
      transition: color .3s, border-color .3s, background .3s;
    }
    .shot-clock.warning {
      color: #ef4444;
      border-color: rgba(239,68,68,.6);
      background: rgba(239,68,68,.12);
      animation: blink .5s ease-in-out infinite alternate;
    }
    @keyframes blink { from{opacity:1} to{opacity:.3} }

    /* ── Possession — center panel, below shot clock ── */
    .posse-strip {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: clamp(.65rem, 1.3vw, .9rem);
      font-weight: 700;
      margin-top: 2px;
    }
    .posse-label { color: #5a6478; font-weight: 400; font-size: .6rem; text-transform: uppercase; letter-spacing: .08em; }
    .posse-name { color: #e6edf3; letter-spacing: 1px; }
    .posse-arrow { font-size: 1rem; }
    .posse-strip.casa-posse .posse-arrow { color: #22c55e; }
    .posse-strip.casa-posse .posse-name { color: #22c55e; }
    .posse-strip.visit-posse .posse-arrow { color: #3b82f6; }
    .posse-strip.visit-posse .posse-name { color: #3b82f6; }

    /* ── Bottom bar ── */
    .bottombar {
      background: #0a0d14;
      border-top: 1px solid #1a2030;
      padding: 5px 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .bottombar-status { font-size: .7rem; color: #5a6478; }

    #statusPartida { color: #8b949e; }

    a.back {
      position: fixed;
      bottom: 44px;
      right: 16px;
      font-size: .65rem;
      color: #1e2430;
      text-decoration: none;
      z-index: 10;
    }
    a.back:hover { color: #5a6478; }
  </style>
</head>
<body>

<div class="topbar">
  <div class="topbar-logo">SisMaster</div>
  <div class="topbar-right">
    <span class="status-live">
      <span class="status-dot" id="dot"></span>
      <span id="statusText">Conectando...</span>
    </span>
    <span id="statusPartida">—</span>
  </div>
</div>

<div class="main">

  <!-- HOME -->
  <div class="team casa" id="teamCasa">
    <div class="team-name" id="nomeCasa">CASA</div>
    <div class="team-score" id="placarCasa">—</div>
    <div class="team-fouls" id="foulsHomeDots">
      <!-- dots rendered by JS -->
    </div>
  </div>

  <!-- CENTER: clock panel -->
  <div class="center-panel">
    <div class="period-badge" id="periodoLabel">—</div>
    <div class="game-clock" id="gameClock">—:——</div>
    <div class="shot-wrapper">
      <div class="shot-label">Shot</div>
      <div class="shot-clock" id="shotClock">24</div>
    </div>
    <div class="posse-strip" id="posseStrip">
      <span class="posse-label">Posse</span>
      <span class="posse-arrow">▶</span>
      <span class="posse-name" id="posseNome">—</span>
    </div>
  </div>

  <!-- AWAY -->
  <div class="team visit" id="teamVisit">
    <div class="team-name" id="nomeVisit">VISITANTE</div>
    <div class="team-score" id="placarVisit">—</div>
    <div class="team-fouls" id="foulsAwayDots">
      <!-- dots rendered by JS -->
    </div>
  </div>

</div>

<div class="bottombar">
  <span class="bottombar-status" id="statusPartida2">—</span>
</div>

<a class="back" href="/arbitros/">← Início</a>

<script>
  const API = 'http://localhost:5200';
  const params = new URLSearchParams(location.search);
  const PARTIDA_ID = params.get('partidaId') || '';

  if (!PARTIDA_ID) {
    document.body.innerHTML = '<div style="padding:40px;color:#ef4444;font-size:1.5rem;text-align:center">Partida ID não informado.<br><a style="color:#f97316" href="/arbitros/">Voltar</a></div>';
  }

  let clockState = null;
  let tickInterval = null;
  let nomeCasaVal = 'CASA', nomeVisitVal = 'VISITANTE';

  // ── Foul dots ──────────────────────────────────────────
  function renderFoulDots(containerId, count, countId) {
    const el = document.getElementById(containerId);
    const MAX = 5;
    el.innerHTML = '';
    for (let i = 0; i < MAX; i++) {
      const d = document.createElement('div');
      d.className = 'foul-dot ' + (i < count ? 'filled' : 'empty');
      el.appendChild(d);
    }
    const num = document.createElement('span');
    num.className = 'foul-count';
    num.id = countId;
    num.textContent = count > 0 ? count : '';
    el.appendChild(num);
  }

  // ── Possession UI ──────────────────────────────────────
  function setPossession(casaPosse) {
    const strip = document.getElementById('posseStrip');
    strip.className = 'posse-strip ' + (casaPosse ? 'casa-posse' : 'visit-posse');
    strip.querySelector('.posse-arrow').textContent = casaPosse ? '▶' : '◀';
    document.getElementById('posseNome').textContent = casaPosse ? (nomeCasaVal || 'CASA') : (nomeVisitVal || 'VISITANTE');
  }

  // ── SignalR ────────────────────────────────────────────
  const connection = new signalR.HubConnectionBuilder()
    .withUrl(`${API}/hubs/sumula?partidaId=${PARTIDA_ID}`, {
      skipNegotiation: true,
      transport: signalR.HttpTransportType.WebSockets
    })
    .withAutomaticReconnect()
    .build();

  connection.on('EstadoAtual', state => {
    updateScore(state);
    updateClock(state.cronometro);
    if (!nomeCasaVal || nomeCasaVal === 'CASA') loadTeamNames();
  });

  connection.on('EventoRegistrado', ev => {
    document.getElementById('placarCasa').textContent = ev.placarCasa;
    document.getElementById('placarVisit').textContent = ev.placarVisitante;
    renderFoulDots('foulsHomeDots', ev.faltasCasa, 'faltasCasaCount');
    renderFoulDots('foulsAwayDots', ev.faltasVisitante, 'faltasVisitCount');
    document.getElementById('periodoLabel').textContent = periodLabel(ev.periodoAtual);
  });

  connection.on('CronometroAtualizado', cron => {
    updateClock(cron);
    if (cron.periodoAtual) document.getElementById('periodoLabel').textContent = periodLabel(cron.periodoAtual);
  });

  connection.onreconnecting(() => setStatus(false));
  connection.onreconnected(() => setStatus(true));

  connection.start()
    .then(async () => {
      setStatus(true);
      await loadTeamNames();
    })
    .catch(() => setStatus(false));

  function setStatus(ok) {
    document.getElementById('dot').className = 'status-dot' + (ok ? ' ok' : '');
    document.getElementById('statusText').textContent = ok ? 'Ao Vivo' : 'Desconectado';
  }

  function updateScore(state) {
    document.getElementById('placarCasa').textContent = state.placarCasa;
    document.getElementById('placarVisit').textContent = state.placarVisitante;
    renderFoulDots('foulsHomeDots', state.faltasCasa, 'faltasCasaCount');
    renderFoulDots('foulsAwayDots', state.faltasVisitante, 'faltasVisitCount');
    document.getElementById('periodoLabel').textContent = periodLabel(state.periodoAtual);
    const sl = statusLabel(state.status);
    document.getElementById('statusPartida').textContent = sl;
    document.getElementById('statusPartida2').textContent = sl;
  }

  async function loadTeamNames() {
    try {
      const r = await fetch(`${API}/api/partidas/${PARTIDA_ID}/jogadores`);
      if (!r.ok) return;
      const d = await r.json();
      nomeCasaVal = d.timeCasa?.nome?.toUpperCase() || 'CASA';
      nomeVisitVal = d.timeVisitante?.nome?.toUpperCase() || 'VISITANTE';
      document.getElementById('nomeCasa').textContent = nomeCasaVal;
      document.getElementById('nomeVisit').textContent = nomeVisitVal;
    } catch {}
  }

  function updateClock(cron) {
    clockState = cron;
    setPossession(cron.posseCasa);

    if (cron.ativo) {
      if (!tickInterval) tickInterval = setInterval(tick, 100);
    } else {
      if (tickInterval) { clearInterval(tickInterval); tickInterval = null; }
      renderGameClock(cron.segundosRestantes, false);
      renderShotClock(cron.shotClockSegundos, false);
    }
  }

  function tick() {
    if (!clockState) return;
    const now = Date.now();

    let gameSec = clockState.segundosRestantes;
    if (clockState.ativo && clockState.iniciadoEmMs) {
      gameSec = Math.max(0, clockState.segundosAoIniciar - (now - clockState.iniciadoEmMs) / 1000);
    }
    renderGameClock(gameSec, clockState.ativo);

    let shotSec = clockState.shotClockSegundos;
    if (clockState.shotClockAtivo && clockState.shotClockIniciadoEmMs) {
      shotSec = Math.max(0, clockState.shotClockSegundosAoIniciar - (now - clockState.shotClockIniciadoEmMs) / 1000);
    }
    renderShotClock(shotSec, clockState.shotClockAtivo);
  }

  function renderGameClock(totalSec, running) {
    const s = Math.floor(totalSec);
    const min = Math.floor(s / 60);
    const sec = s % 60;
    const el = document.getElementById('gameClock');
    el.textContent = `${min}:${sec.toString().padStart(2, '0')}`;
    el.className = 'game-clock' + (running ? (s <= 30 ? ' warning' : ' running') : '');
  }

  function renderShotClock(sec, running) {
    const s = Math.floor(sec);
    const el = document.getElementById('shotClock');
    el.textContent = s.toString().padStart(2, '0');
    el.className = 'shot-clock' + (running && s <= 5 ? ' warning' : '');
  }

  function periodLabel(n) {
    return ['', '1º', '2º', '3º', '4º', 'Prorrg.'][n] || n + 'º';
  }

  function statusLabel(s) {
    return { EmPreparacao: 'Em preparação', Preparada: 'Em preparação', NaoIniciada: 'Em preparação', EmAndamento: 'Em Andamento', Intervalo: 'Intervalo', Encerrada: 'Encerrada' }[s] || s || '';
  }
</script>
</body>
</html>
