<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SisMaster — Placar</title>
  <script src="signalr.min.js"></script>
  <script src="conexao.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #050810;
      color: #e6edf3;
      height: 100%;
      overflow: hidden;
    }
    body {
      display: grid;
      grid-template-rows: auto 1fr auto;
      height: 100vh;
    }

    /* Tudo em unidades da largura da tela (vw): legível a 15 m e escala de 1280 px a 4K. */
    .faixa-offline { display: none; position: fixed; top: 0; left: 0; right: 0; z-index: 20; background: #b91c1c; color: #fff; text-align: center; font-weight: 800; font-size: 2.4vw; padding: .6vw 1vw; letter-spacing: .1vw; }
    body.offline .faixa-offline { display: block; }
    body.offline .main { opacity: .55; }
    body { grid-template-rows: auto 1fr; }

    /* ── Top bar ── */
    .topbar { padding: .8vw 2vw; display: flex; align-items: center; justify-content: space-between; font-size: 1.6vw; color: #8a96ab; }
    .topbar-logo { font-weight: 800; color: #f97316; letter-spacing: .3vw; }
    .topbar-right { display: flex; align-items: center; gap: 2vw; }
    .status-live { display: flex; align-items: center; gap: .6vw; }
    .status-dot { width: 1.2vw; height: 1.2vw; border-radius: 50%; background: #ef4444; }
    .status-dot.ok { background: #22c55e; animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.5} }

    /* ── Main grid ── */
    .main { display: grid; grid-template-columns: 1fr 26vw 1fr; align-items: center; padding: 0 1.5vw; overflow: hidden; transition: opacity .3s; min-height: 0; }

    /* ── Equipes ── */
    .team { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .6vw; text-align: center; min-width: 0; }
    .team-name { font-size: 3.6vw; font-weight: 900; text-transform: uppercase; letter-spacing: .2vw; line-height: 1.05; max-width: 100%; overflow-wrap: anywhere; }
    .team-name.longo { font-size: 2.6vw; }
    .team-score { font-size: 22vw; font-weight: 900; line-height: .9; font-variant-numeric: tabular-nums; letter-spacing: -.8vw; }
    .casa .team-name, .casa .team-score { color: #22c55e; }
    .visit .team-name, .visit .team-score { color: #3b82f6; }

    /* Faltas de equipe no período: número grande ao lado das bolinhas; vermelho na 5ª; nunca passa de 5 */
    .team-fouls { display: flex; align-items: center; gap: 1vw; margin-top: .4vw; }
    .foul-count { font-size: 5.2vw; font-weight: 900; color: #f59e0b; min-width: 3vw; text-align: center; }
    .foul-dots { display: flex; gap: .7vw; }
    .foul-dot { width: 2.2vw; height: 2.2vw; border-radius: 50%; border: .25vw solid #3a4560; transition: background .3s; }
    .foul-dot.filled { background: #f59e0b; border-color: #f59e0b; }
    .foul-dot.estourou { background: #ef4444; border-color: #ef4444; }
    .foul-count.estourou { color: #ef4444; }

    /* Fim de jogo: vencedor em destaque, perdedor esmaecido */
    body.fim .team.perdeu { opacity: .4; }
    body.fim .team.venceu .team-score { text-shadow: 0 0 3vw currentColor; }
    .fim-banner { display: none; position: fixed; left: 0; right: 0; bottom: 0; background: #f97316; color: #111; text-align: center; font-size: 3.4vw; font-weight: 900; letter-spacing: .5vw; padding: .9vw; }
    body.fim .fim-banner { display: block; }
    body.fim .shot-wrapper, body.fim .posse-strip { visibility: hidden; }

    /* ── Centro: período, relógio, shot e posse ── */
    .center-panel { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.2vw; border-left: .15vw solid #1a2030; border-right: .15vw solid #1a2030; height: 100%; }
    .period-badge { font-size: 3.2vw; font-weight: 900; color: #f97316; background: rgba(249,115,22,.12); border: .2vw solid rgba(249,115,22,.5); border-radius: 5vw; padding: .4vw 2.4vw; white-space: nowrap; }
    .game-clock { font-size: 10.5vw; font-weight: 900; font-variant-numeric: tabular-nums; letter-spacing: -.4vw; line-height: 1; color: #f1f5f9; transition: color .3s; }
    .game-clock.running { color: #22c55e; }
    .game-clock.warning { color: #ef4444; }
    .shot-wrapper { display: flex; align-items: center; gap: 1.2vw; }
    .shot-label { font-size: 2vw; text-transform: uppercase; letter-spacing: .2vw; color: #8a96ab; }
    .shot-clock { font-size: 6.4vw; font-weight: 900; font-variant-numeric: tabular-nums; color: #f59e0b; background: rgba(245,158,11,.1); border: .25vw solid rgba(245,158,11,.45); border-radius: 50%; width: 11vw; height: 11vw; display: flex; align-items: center; justify-content: center; line-height: 1; transition: color .3s, border-color .3s, background .3s; }
    .shot-clock.warning { color: #ef4444; border-color: rgba(239,68,68,.6); background: rgba(239,68,68,.12); animation: blink .5s ease-in-out infinite alternate; }
    @keyframes blink { from{opacity:1} to{opacity:.3} }
    .posse-strip { display: flex; align-items: center; gap: .8vw; font-size: 2.6vw; font-weight: 800; }
    .posse-label { color: #8a96ab; font-weight: 700; font-size: 1.8vw; text-transform: uppercase; letter-spacing: .15vw; }
    .posse-strip.casa-posse { color: #22c55e; }
    .posse-strip.visit-posse { color: #3b82f6; }

    a.back { position: fixed; bottom: 1vw; right: 1vw; font-size: .9vw; color: #1e2430; text-decoration: none; z-index: 10; }
    a.back:hover { color: #5a6478; }
  </style>
</head>
<body>

<div class="faixa-offline" role="alert">SEM CONEXÃO — o placar pode estar desatualizado</div>

<div class="topbar">
  <div class="topbar-logo">SISMASTER</div>
  <div class="topbar-right">
    <span class="status-live">
      <span class="status-dot" id="dot"></span>
      <span id="statusText">Conectando...</span>
    </span>
    <span id="statusPartida">—</span>
  </div>
</div>

<div class="main">

  <!-- CASA -->
  <div class="team casa" id="teamCasa">
    <div class="team-name" id="nomeCasa">CASA</div>
    <div class="team-score" id="placarCasa">—</div>
    <div class="team-fouls" id="foulsHomeDots"></div>
  </div>

  <!-- CENTRO -->
  <div class="center-panel">
    <div class="period-badge" id="periodoLabel">—</div>
    <div class="game-clock" id="gameClock">—:——</div>
    <div class="shot-wrapper">
      <div class="shot-label">Shot</div>
      <div class="shot-clock" id="shotClock">24</div>
    </div>
    <div class="posse-strip" id="posseStrip">
      <span class="posse-label">Posse</span>
      <span class="posse-arrow">▶</span>
      <span class="posse-name" id="posseNome">—</span>
    </div>
  </div>

  <!-- VISITANTE -->
  <div class="team visit" id="teamVisit">
    <div class="team-name" id="nomeVisit">VISITANTE</div>
    <div class="team-score" id="placarVisit">—</div>
    <div class="team-fouls" id="foulsAwayDots"></div>
  </div>

</div>

<div class="fim-banner">FIM DE JOGO</div>
<span id="statusPartida2" hidden></span>

<a class="back" href="/arbitros/">← Início</a>

<script>
  const API = ''; // mesma origem: o nginx encaminha /api e /hubs (o placar é público, sem login)
  const params = new URLSearchParams(location.search);
  const PARTIDA_ID = params.get('partidaId') || '';

  if (!PARTIDA_ID) {
    document.body.innerHTML = '<div style="padding:40px;color:#ef4444;font-size:1.5rem;text-align:center">Partida ID não informado.<br><a style="color:#f97316" href="/arbitros/">Voltar</a></div>';
  }

  let clockState = null;
  let tickInterval = null;
  let nomeCasaVal = 'CASA', nomeVisitVal = 'VISITANTE';

  // ── Faltas de equipe do período: número grande + bolinhas; nunca passa de 5; vermelho na 5ª ──
  function renderFoulDots(containerId, count, countId) {
    const el = document.getElementById(containerId);
    const MAX = 5;
    const estourou = count >= MAX;
    count = Math.min(count, MAX);
    el.innerHTML = '';
    const num = document.createElement('span');
    num.className = 'foul-count' + (estourou ? ' estourou' : '');
    num.id = countId;
    num.textContent = count;
    el.appendChild(num);
    const dots = document.createElement('div');
    dots.className = 'foul-dots';
    for (let i = 0; i < MAX; i++) {
      const d = document.createElement('div');
      d.className = 'foul-dot' + (i < count ? ' filled' : '') + (estourou ? ' estourou' : '');
      dots.appendChild(d);
    }
    el.appendChild(dots);
  }
  renderFoulDots('foulsHomeDots', 0, 'faltasCasaCount');
  renderFoulDots('foulsAwayDots', 0, 'faltasVisitCount');

  // ── Possession UI ──────────────────────────────────────
  function setPossession(casaPosse) {
    const strip = document.getElementById('posseStrip');
    strip.className = 'posse-strip ' + (casaPosse ? 'casa-posse' : 'visit-posse');
    strip.querySelector('.posse-arrow').textContent = casaPosse ? '▶' : '◀';
    document.getElementById('posseNome').textContent = casaPosse ? (nomeCasaVal || 'CASA') : (nomeVisitVal || 'VISITANTE');
  }

  // ── Conexão em tempo real (não desiste; ver conexao.js) ─────────────
  let deslocamentoMs = 0;   // hora do servidor menos a do aparelho: a TV com a hora errada não adianta nem atrasa o cronômetro
  const conexao = SisMasterConexao.criar({
    partidaId: PARTIDA_ID,
    aoMudar: ok => { setStatus(ok); if (ok) loadTeamNames(); },
    registrar: connection => {
      connection.on('EstadoAtual', state => {
        updateScore(state);
        updateClock(state.cronometro);
        if (!nomeCasaVal || nomeCasaVal === 'CASA') loadTeamNames();
      });

      connection.on('EventoRegistrado', ev => {
        document.getElementById('placarCasa').textContent = ev.placarCasa;
        document.getElementById('placarVisit').textContent = ev.placarVisitante;
        renderFoulDots('foulsHomeDots', ev.faltasCasa, 'faltasCasaCount');
        renderFoulDots('foulsAwayDots', ev.faltasVisitante, 'faltasVisitCount');
        document.getElementById('periodoLabel').textContent = periodLabel(ev.periodoAtual);
      });

      connection.on('CronometroAtualizado', cron => {
        updateClock(cron);
        if (cron.periodoAtual) document.getElementById('periodoLabel').textContent = periodLabel(cron.periodoAtual);
        // As faltas de equipe zeram a cada período: o servidor manda a contagem junto com o relógio.
        if (cron.faltasCasa !== undefined) {
          renderFoulDots('foulsHomeDots', cron.faltasCasa, 'faltasCasaCount');
          renderFoulDots('foulsAwayDots', cron.faltasVisitante, 'faltasVisitCount');
        }
      });

      // Encerramento (inclusive por importação do FIBA LiveStats): mostra o placar final e o fim de jogo; quem
      // reconecta recebe o estado completo (faltas, período e status) de novo.
      connection.on('SumulaEncerrada', p => {
        document.getElementById('placarCasa').textContent = p.placarCasa;
        document.getElementById('placarVisit').textContent = p.placarVisitante;
        marcarFim(true, p.placarCasa, p.placarVisitante);
        document.getElementById('statusPartida').textContent = 'Encerrada';
      });
    }
  });

  function setStatus(ok) {
    document.getElementById('dot').className = 'status-dot' + (ok ? ' ok' : '');
    document.getElementById('statusText').textContent = ok ? 'Ao Vivo' : 'Sem conexão';
    document.body.classList.toggle('offline', !ok);
  }

  // Fim de jogo: faixa, vencedor em destaque e perdedor esmaecido (no basquete não há empate).
  function marcarFim(fim, casa, visit) {
    document.body.classList.toggle('fim', fim);
    document.getElementById('teamCasa').classList.toggle('venceu', fim && casa > visit);
    document.getElementById('teamCasa').classList.toggle('perdeu', fim && casa < visit);
    document.getElementById('teamVisit').classList.toggle('venceu', fim && visit > casa);
    document.getElementById('teamVisit').classList.toggle('perdeu', fim && visit < casa);
  }

  function updateScore(state) {
    document.getElementById('placarCasa').textContent = state.placarCasa;
    document.getElementById('placarVisit').textContent = state.placarVisitante;
    renderFoulDots('foulsHomeDots', state.faltasCasa, 'faltasCasaCount');
    renderFoulDots('foulsAwayDots', state.faltasVisitante, 'faltasVisitCount');
    document.getElementById('periodoLabel').textContent = periodLabel(state.periodoAtual);
    const sl = statusLabel(state.status);
    document.getElementById('statusPartida').textContent = sl;
    marcarFim(state.status === 'Encerrada', state.placarCasa, state.placarVisitante);
  }

  async function loadTeamNames() {
    try {
      const r = await fetch(`${API}/api/partidas/${PARTIDA_ID}/jogadores`);
      if (!r.ok) return;
      const d = await r.json();
      nomeCasaVal = d.timeCasa?.nome?.toUpperCase() || 'CASA';
      nomeVisitVal = d.timeVisitante?.nome?.toUpperCase() || 'VISITANTE';
      document.getElementById('nomeCasa').textContent = nomeCasaVal;
      document.getElementById('nomeVisit').textContent = nomeVisitVal;
      document.getElementById('nomeCasa').classList.toggle('longo', nomeCasaVal.length > 16);
      document.getElementById('nomeVisit').classList.toggle('longo', nomeVisitVal.length > 16);
    } catch {}
  }

  function updateClock(cron) {
    clockState = cron;
    if (cron.agoraMs) deslocamentoMs = cron.agoraMs - Date.now();
    setPossession(cron.posseCasa);

    if (cron.ativo) {
      if (!tickInterval) tickInterval = setInterval(tick, 100);
    } else {
      if (tickInterval) { clearInterval(tickInterval); tickInterval = null; }
      renderGameClock(cron.segundosRestantes, false);
      renderShotClock(cron.shotClockSegundos, false);
    }
  }

  function tick() {
    if (!clockState) return;
    const now = Date.now() + deslocamentoMs;

    let gameSec = clockState.segundosRestantes;
    if (clockState.ativo && clockState.iniciadoEmMs) {
      gameSec = Math.max(0, clockState.segundosAoIniciar - (now - clockState.iniciadoEmMs) / 1000);
    }
    renderGameClock(gameSec, clockState.ativo);

    let shotSec = clockState.shotClockSegundos;
    if (clockState.shotClockAtivo && clockState.shotClockIniciadoEmMs) {
      shotSec = Math.max(0, clockState.shotClockSegundosAoIniciar - (now - clockState.shotClockIniciadoEmMs) / 1000);
    }
    renderShotClock(shotSec, clockState.shotClockAtivo);
  }

  // Arredonda para cima, com 1 casa decimal (nunca mostra "0.0" antes da hora de verdade acabar).
  const arredondarDecimo = sec => Math.ceil(sec * 10) / 10;

  function renderGameClock(totalSec, running) {
    const s = Math.floor(totalSec);
    const el = document.getElementById('gameClock');
    // Último minuto do período: só segundos, com décimos (padrão oficial de cronômetro de jogo).
    el.textContent = totalSec <= 59.9
      ? arredondarDecimo(totalSec).toFixed(1)
      : `${Math.floor(s / 60)}:${(s % 60).toString().padStart(2, '0')}`;
    el.className = 'game-clock' + (running ? (s <= 30 ? ' warning' : ' running') : '');
  }

  function renderShotClock(sec, running) {
    const el = document.getElementById('shotClock');
    // Cronômetro de jogo rodando mas o shot clock não ligou: o período acaba antes dele estourar, não vale mais.
    if (clockState?.ativo && !clockState?.shotClockAtivo) {
      el.textContent = '—';
      el.className = 'shot-clock';
      return;
    }
    const s = Math.floor(sec);
    // Últimos 5s do shot clock: com décimos.
    el.textContent = sec <= 4.9 ? arredondarDecimo(sec).toFixed(1) : s.toString().padStart(2, '0');
    el.className = 'shot-clock' + (running && s <= 5 ? ' warning' : '');
  }

  function periodLabel(n) {
    return ['', '1º PERÍODO', '2º PERÍODO', '3º PERÍODO', '4º PERÍODO', 'PRORROGAÇÃO'][n] || n + 'º PERÍODO';
  }

  function statusLabel(s) {
    return { EmPreparacao: 'Em preparação', Preparada: 'Em preparação', NaoIniciada: 'Em preparação', EmAndamento: 'Em Andamento', Intervalo: 'Intervalo', Encerrada: 'Encerrada' }[s] || s || '';
  }
</script>
</body>
</html>
